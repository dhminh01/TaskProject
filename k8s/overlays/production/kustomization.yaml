apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Reference to base configuration
resources:
  - ../../

# Namespace override for production
namespace: taskproject-prod

# Production-specific patches
patches:
  # Increase resource requirements for production
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "1Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "2Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"

  # Increase replica counts for production
  - target:
      kind: Deployment
      name: task-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3

  - target:
      kind: Deployment
      name: email-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3

  - target:
      kind: Deployment
      name: gateway-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3

  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3

  # Production security patches
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext
        value:
          runAsNonRoot: true
          runAsUser: 1000
          fsGroup: 2000

# Production images (using production tags)
images:
  - name: taskproject/task-service
    newTag: v1.0.0
  - name: taskproject/email-service
    newTag: v1.0.0
  - name: taskproject/gateway-service
    newTag: v1.0.0
  - name: taskproject/frontend
    newTag: v1.0.0

# Additional labels for production environment
commonLabels:
  environment: production

# Production-specific ConfigMap
configMapGenerator:
  - name: taskproject-prod-config
    behavior: merge
    literals:
      - ASPNETCORE_ENVIRONMENT=Production
      - LOG_LEVEL=Warning
      - ENABLE_SWAGGER=false
      - METRICS_ENABLED=true
