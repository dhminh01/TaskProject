apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: taskproject
  labels:
    app: gateway-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: taskproject/gateway-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: taskproject-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ASPNETCORE_URLS
              value: "http://+:5000"
            - name: TASK_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: taskproject-config
                  key: TASK_SERVICE_URL
            - name: EMAIL_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: taskproject-config
                  key: EMAIL_SERVICE_URL
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: taskproject
  labels:
    app: gateway-service
spec:
  selector:
    app: gateway-service
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
  type: ClusterIP
