apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-service
  namespace: taskproject
  labels:
    app: task-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-service
  template:
    metadata:
      labels:
        app: task-service
    spec:
      containers:
        - name: task-service
          image: taskproject/task-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5008
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: taskproject-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ASPNETCORE_URLS
              value: "http://+:5008"
            - name: ConnectionStrings__DefaultConnection
              value: "Server=$(DB_SERVER),$(DB_PORT);Database=$(DB_NAME);User Id=$(DB_USER);Password=$(DB_PASSWORD);TrustServerCertificate=True"
            - name: DB_SERVER
              valueFrom:
                configMapKeyRef:
                  name: taskproject-config
                  key: DB_SERVER
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: taskproject-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: taskproject-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: taskproject-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskproject-secrets
                  key: DB_PASSWORD
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: taskproject-config
                  key: RABBITMQ_HOST
            - name: RABBITMQ_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: taskproject-config
                  key: RABBITMQ_USERNAME
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskproject-secrets
                  key: RABBITMQ_PASSWORD
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 5008
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5008
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: task-service
  namespace: taskproject
  labels:
    app: task-service
spec:
  selector:
    app: task-service
  ports:
    - port: 5008
      targetPort: 5008
      protocol: TCP
  type: ClusterIP
