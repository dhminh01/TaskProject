apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-service
  namespace: taskproject
  labels:
    app: email-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: email-service
  template:
    metadata:
      labels:
        app: email-service
    spec:
      containers:
        - name: email-service
          image: taskproject/email-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5009
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: taskproject-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ASPNETCORE_URLS
              value: "http://+:5009"
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: taskproject-config
                  key: RABBITMQ_HOST
            - name: RABBITMQ_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: taskproject-config
                  key: RABBITMQ_USERNAME
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskproject-secrets
                  key: RABBITMQ_PASSWORD
            - name: GMAIL_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: taskproject-secrets
                  key: GMAIL_CLIENT_ID
            - name: GMAIL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: taskproject-secrets
                  key: GMAIL_CLIENT_SECRET
            - name: GMAIL_FROM_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: taskproject-config
                  key: GMAIL_FROM_EMAIL
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 5009
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5009
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: email-service
  namespace: taskproject
  labels:
    app: email-service
spec:
  selector:
    app: email-service
  ports:
    - port: 5009
      targetPort: 5009
      protocol: TCP
  type: ClusterIP
