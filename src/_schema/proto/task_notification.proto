syntax = "proto3";

option csharp_namespace = "TaskProject.Proto";

import "google/protobuf/timestamp.proto";

package tasknotification;

service EmailNotification {
  rpc NotifyEmailSent (EmailSentRequest) returns (EmailSentResponse);
}

message EmailSentRequest {
  string task_id = 1;
  string task_title = 2;
  string email_status = 3;
  google.protobuf.Timestamp sent_timestamp = 4;
}

message EmailSentResponse {
  bool success = 1;
  string message = 2;
}
