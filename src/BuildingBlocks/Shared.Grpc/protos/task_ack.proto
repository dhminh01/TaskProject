syntax = "proto3";

option csharp_namespace = "Shared.Grpc";

package taskservice;

// Service for email acknowledgments from EmailService back to TaskService
service TaskAckService {
  rpc AcknowledgeTaskEmail (TaskEmailAckRequest) returns (TaskEmailAckResponse);
}

// Request message for email acknowledgment
message TaskEmailAckRequest {
  string task_id = 1;
  bool success = 2;
  string error_message = 3;
  int64 timestamp = 4;
}

// Response message for email acknowledgment
message TaskEmailAckResponse {
  bool acknowledged = 1;
  string message = 2;
}